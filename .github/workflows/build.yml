name: ArduPilot Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Скачуємо офіційний ArduPilot
      - name: Checkout ArduPilot
        uses: actions/checkout@v4
        with:
          repository: ArduPilot/ardupilot
          submodules: recursive
          ref: master

      # 2. Встановлюємо залежності
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi python3-dev libpython3-dev

      # 3. Збираємо прошивку
      - name: Build
        run: |
          python3 waf configure --board f103-GPS --disable-scripting
          python3 waf build

      # 4. Завантажуємо результат
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: build/f103-GPS/bin/

name: ArduPilot Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ArduPilot
        uses: actions/checkout@v4
        with:
          repository: ArduPilot/ardupilot
          submodules: recursive
          ref: master

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi python3-dev libpython3-dev
          python3 -m pip install empy==3.3.4 pyserial

      - name: Build
        run: |
          # Конфігурація з мінімальними налаштуваннями, щоб уникнути помилок компіляції
          python3 waf configure --board f103-GPS
          python3 waf build

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: build/f103-GPS/bin/
